{% extends 'base.html' %}

{% block title %}Experience - {{ name }}{% endblock %}

{% block content %}
<section class="gallery-section" id="gallery" aria-labelledby="gallery-heading">
            <div class="container">
                <h2 id="gallery-heading" class="section-title">Gallery</h2>
                <p class="section-intro">A few personal snapshots from projects, events, and everyday moments.</p>
            </div>
            <div class="gallery-frame">
                <div class="gallery-grid">
                    {% for photo, position in gallery_items %}
                        <div class="gallery-cell {{ position }}">
                            <img src="{{ photo.image_path }}" alt="{{ photo.caption|default:'Gallery photo' }}">
                        </div>
                    {% empty %}
                        <p class="empty-state">No photos have been added yet.</p>
                    {% endfor %}
                </div>
            </div>
        </section>
{% endblock %}
