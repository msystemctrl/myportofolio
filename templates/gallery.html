{% extends 'base.html' %}

{% block meta %}
    <title>Gallery - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main>
        <section class="gallery-section" id="gallery" aria-labelledby="gallery-heading">
            <div class="container">
                <h2 id="gallery-heading" class="section-title">Gallery</h2>
                <p class="section-intro">A few personal snapshots from projects, events, and everyday moments.</p>
            </div>
            <div class="gallery-frame">
                <div class="gallery-grid">
                    <div class="gallery-cell g-a">
                        <img src="/static/img/gallery/gambar1.jpeg" alt="Gallery photo 1">
                    </div>
                        <div class="gallery-cell g-b">
                            <img src="/static/img/gallery/gambar2.jpeg" alt="Gallery photo 2">
                        </div>
                        <div class="gallery-cell g-c">
                            <img src="/static/img/gallery/gambar3.jpeg" alt="Gallery photo 3">
                        </div>
                        <div class="gallery-cell g-d">
                            <img src="/static/img/gallery/gambar4.jpeg" alt="Gallery photo 4">
                        </div>
                        <div class="gallery-cell g-e">
                            <img src="/static/img/gallery/gambar5.jpeg" alt="Gallery photo 5">
                        </div>
                        <div class="gallery-cell g-f">
                            <img src="/static/img/gallery/gambar6.jpeg" alt="Gallery photo 6">
                        </div>
                </div>
            </div>
        </section>
    </main>
{% endblock %}
