{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block meta %}
        <title>{{ name }} - Portfolio</title>
    {% endblock meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/M favicon.ico" type="image/x-icon">
</head>
<body>
    <audio id="background-music" loop>
        <source src="/static/audio/music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <header class="site-header">
        <div class="container">
            <button class="brand" id="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-navigation">
                <img src="/static/img/M orange.png" alt="Marsya logo" class="brand-logo">
            </button>
            <nav id="site-navigation">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experiences</a>
                <a href="{% url 'main:show_education' %}">Education</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
                <a href="{% url 'main:show_gallery' %}">Gallery</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
